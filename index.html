<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Silver Mosh">
<meta name="theme-color" content="#0b0b0f">
<title>Silver Mosh</title>
<style>
/* Layout: full-bleed camera canvas, chrome floats over it like a native camera app */
:root{
  --ink:#0b0b0f;
  --chrome:#dcdad4;
  --dim:#8d8b96;
  --glass:rgba(14,13,20,.55);
  --rec:#ff3b4e;
  --violet:#7b5cff;
  --cyan:#3ff0e0;
  --yellow:#ffe23a;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--ink);color:var(--chrome);font-family:var(--mono);overflow:hidden;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--ink)}
#src{position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none}

.top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  pointer-events:none;font-size:11px;letter-spacing:.18em;text-transform:uppercase}
.brand{display:flex;gap:8px;align-items:center;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.brand i{display:inline-block;width:14px;height:6px;background:linear-gradient(90deg,var(--violet) 0 25%,var(--cyan) 25% 50%,var(--yellow) 50% 75%,var(--rec) 75%)}
.timer{display:none;align-items:center;gap:6px;background:var(--glass);padding:5px 9px;border-radius:4px;font-variant-numeric:tabular-nums;letter-spacing:.08em}
.timer::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--rec)}
.recording .timer{display:flex}

.dock{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:14px;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);padding-top:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(to top,rgba(5,5,8,.7),rgba(5,5,8,0))}
.sliders{display:grid;grid-template-columns:auto 1fr auto;gap:10px 12px;align-items:center;font-size:10px;letter-spacing:.16em;text-transform:uppercase;max-width:520px;width:100%;margin:0 auto}
.sliders output{font-variant-numeric:tabular-nums;color:var(--dim);min-width:2.5em;text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:linear-gradient(90deg,var(--chrome),var(--dim))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-7px;background:var(--chrome);border:0;border-radius:2px;box-shadow:2px 0 0 var(--violet),-2px 0 0 var(--cyan)}
input[type=range]::-moz-range-track{height:2px;background:var(--chrome)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;background:var(--chrome);border:0;border-radius:2px}
.row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;max-width:520px;width:100%;margin:0 auto}
.ghost{justify-self:start;width:48px;height:48px;border-radius:50%;border:1px solid rgba(220,218,212,.35);background:var(--glass);color:var(--chrome);display:grid;place-items:center;cursor:pointer;padding:0}
.ghost:last-child{justify-self:end}
.ghost svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ghost:disabled{opacity:.35}
.shutter{width:76px;height:76px;border-radius:50%;border:3px solid var(--chrome);background:transparent;padding:5px;cursor:pointer}
.shutter span{display:block;width:100%;height:100%;border-radius:50%;background:var(--rec);transition:border-radius .2s,transform .2s}
.recording .shutter span{border-radius:8px;transform:scale(.55)}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--cyan);outline-offset:3px}
.hint{text-align:center;font-size:10px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}

.sheet{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:22px;background:rgba(8,8,12,.94);
  padding-top:calc(env(safe-area-inset-top,0px) + 24px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px);
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));text-align:center}
.sheet[hidden]{display:none!important}
.sheet h1{margin:0;font-size:clamp(34px,11vw,56px);line-height:.95;letter-spacing:-.02em;font-weight:700;text-transform:uppercase;
  text-shadow:3px 0 0 var(--violet),-3px 0 0 var(--cyan)}
.sheet p{margin:0;max-width:30ch;line-height:1.55;font-size:13px;color:var(--dim)}
.sheet .err{color:var(--yellow)}
.btn{font:inherit;font-size:13px;letter-spacing:.14em;text-transform:uppercase;padding:15px 26px;border-radius:4px;border:0;background:var(--chrome);color:var(--ink);cursor:pointer;min-width:220px}
.btn.alt{background:transparent;color:var(--chrome);border:1px solid rgba(220,218,212,.4)}
.check{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--dim);letter-spacing:.06em}
.check input{width:18px;height:18px;accent-color:var(--violet)}
.media{max-width:min(78vw,380px);max-height:58vh;border-radius:6px;background:#000;display:block}
.stack{display:flex;flex-direction:column;gap:12px;align-items:center}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
</style>
</head>
<body>
<canvas id="view"></canvas>
<video id="src" playsinline muted autoplay></video>

<div class="top">
  <div class="brand"><i></i>Silver Mosh</div>
  <div class="timer" id="timer">00:00</div>
</div>

<div class="dock" id="dock" hidden>
  <div class="sliders">
    <label for="melt">Melt</label><input id="melt" type="range" min="0" max="100" value="75"><output id="meltOut">75</output>
    <label for="glitch">Glitch</label><input id="glitch" type="range" min="0" max="100" value="70"><output id="glitchOut">70</output>
  </div>
  <div class="row">
    <button class="ghost" id="flip" aria-label="Switch camera">
      <svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><path d="M9.5 12.5a3 3 0 0 1 5-1.5M14.5 14.5a3 3 0 0 1-5 1.5"/><path d="M14.5 9.5v1.5H13M9.5 17.5V16H11"/></svg>
    </button>
    <button class="shutter" id="shutter" aria-label="Record video"><span></span></button>
    <button class="ghost" id="photo" aria-label="Take photo">
      <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><circle cx="12" cy="12.5" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>
    </button>
  </div>
  <div class="hint">Tap the picture to glitch it</div>
</div>

<div class="sheet" id="start">
  <h1>Silver<br>Mosh</h1>
  <p>Live datamosh camera. Your picture melts along its own edges and breaks into rainbow pixels.</p>
  <p class="err" id="err" hidden></p>
  <div class="stack">
    <button class="btn" id="go">Start camera</button>
    <label class="check"><input type="checkbox" id="sound" checked> Record sound</label>
    <label class="btn alt file">Use a video instead<input type="file" id="pick" accept="video/*"></label>
  </div>
</div>

<div class="sheet" id="result" hidden>
  <div id="resultMedia"></div>
  <div class="stack">
    <button class="btn" id="save">Save</button>
    <button class="btn alt" id="discard">Back to camera</button>
  </div>
</div>

<script>
(() => {
'use strict';

/* ---------- GL setup ---------- */
const canvas = document.getElementById('view');
const video = document.getElementById('src');
const gl = canvas.getContext('webgl', {preserveDrawingBuffer:true, antialias:false, alpha:false, premultipliedAlpha:false, powerPreference:'high-performance'});

const VS = `attribute vec2 p; varying vec2 vUv; void main(){ vUv = p*0.5+0.5; gl_Position = vec4(p,0.0,1.0); }`;

const COMMON = `
precision highp float;
varying vec2 vUv;
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*.1031); p3 += dot(p3, p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
  float a=hash12(i), b=hash12(i+vec2(1.0,0.0)), c=hash12(i+vec2(0.0,1.0)), d=hash12(i+vec2(1.0,1.0));
  return mix(mix(a,b,f.x), mix(c,d,f.x), f.y); }
float luma(vec3 c){ return dot(c, vec3(0.299,0.587,0.114)); }
`;

/* Pass 1: datamosh feedback. Previous output is pushed along the camera's motion
   and along its own contours (the "liquid swirl"), and only partly refreshed. */
const FS_FEEDBACK = COMMON + `
uniform sampler2D uCam, uCamPrev, uState;
uniform vec2 uRes;
uniform float uTime, uMelt, uKey, uStep, uMirror;
uniform vec4 uXf;
vec2 cuv(vec2 uv){ uv = uv*uXf.xy + uXf.zw; if(uMirror > 0.5) uv.x = 1.0-uv.x; return uv; }
float L(sampler2D t, vec2 uv){ return luma(texture2D(t, cuv(uv)).rgb); }
vec2 flowAt(vec2 uv){
  vec2 px = 5.0/uRes;
  float c  = L(uCam, uv);
  float gx = L(uCam, uv+vec2(px.x,0.0)) - L(uCam, uv-vec2(px.x,0.0));
  float gy = L(uCam, uv+vec2(0.0,px.y)) - L(uCam, uv-vec2(0.0,px.y));
  vec2 g = vec2(gx, gy);
  float dt = c - L(uCamPrev, uv);
  vec2 nf = clamp(-dt * g * 10.0 / (dot(g,g) + 0.004), -9.0, 9.0);   // motion, in pixels
  vec2 tang = vec2(-g.y, g.x) * 16.0;                                   // swirl along contours
  float n = uTime*0.18;
  vec2 q = uv*vec2(2.6, 4.2);
  vec2 curl = vec2(vnoise(q+vec2(n,0.0))-0.5, vnoise(q+vec2(5.2,1.3-n))-0.5) * 5.0;
  return nf + tang + curl;
}
void main(){
  vec2 uv = vUv;
  vec2 bs = vec2(14.0);
  vec2 blk = floor(uv*uRes/bs);
  vec2 bc = (blk+0.5)*bs/uRes;
  vec2 f = mix(flowAt(uv), flowAt(bc), 0.65);          // macroblock motion vectors
  float mx = 7.0*uMelt + 0.001;
  float len = length(f);
  if(len > mx) f *= mx/len;
  f *= uMelt * uStep;
  vec3 prev = texture2D(uState, uv - f/uRes).rgb;
  vec3 cam  = texture2D(uCam, cuv(uv)).rgb;
  float camDt = abs(L(uCam,uv) - L(uCamPrev,uv));
  float bh = hash12(blk + floor(uTime*8.0)*vec2(17.3, 9.1));
  float refresh = mix(0.35, 0.025, uMelt) * uStep;
  refresh *= 1.0 - smoothstep(0.02, 0.12, camDt)*uMelt*0.85;           // moving areas smear
  if(bh < mix(0.08, 0.005, uMelt)) refresh = 1.0;                        // I-frame patches
  refresh = clamp(max(refresh, uKey), 0.0, 1.0);
  gl_FragColor = vec4(mix(prev, cam, refresh), 1.0);
}`;

/* Pass 2: streaks, silver grade, rainbow pixel glitch, glitch bands, colour lines. */
const FS_OUT = COMMON + `
uniform sampler2D uState;
uniform vec2 uRes;
uniform float uTime, uGlitch, uMelt, uAng, uScale;
uniform vec4 uBand, uMir;
vec3 pal(float i){ i = mod(floor(i), 6.0);
  if(i < 0.5) return vec3(0.48,0.36,1.00);
  if(i < 1.5) return vec3(0.25,0.94,0.88);
  if(i < 2.5) return vec3(1.00,0.89,0.23);
  if(i < 3.5) return vec3(1.00,0.25,0.69);
  if(i < 4.5) return vec3(1.00,0.18,0.20);
  return vec3(0.30,0.95,0.40); }
vec3 st(vec2 uv){ return texture2D(uState, uv).rgb; }
void main(){
  vec2 px = vUv*uRes;
  vec2 uv = vUv;
  float S = uScale;

  // glitch band: slices shifted sideways
  float inBand = 0.0;
  if(uBand.z > 0.0){
    float d = uv.y - uBand.x;
    inBand = step(abs(d), uBand.y);
    float sub = floor(d / (uBand.y*0.5 + 1e-4));
    uv.x += inBand * (hash12(vec2(sub, uBand.w*100.0)) - 0.5) * 0.3;
  }
  // kaleidoscope slab: mirrored chevrons
  if(uMir.z > uMir.x && uv.x > uMir.x && uv.x < uMir.z && uv.y > uMir.y && uv.y < uMir.w){
    float w = uMir.z - uMir.x, h = uMir.w - uMir.y;
    float cx = (uMir.x + uMir.z)*0.5;
    float ax = abs(uv.x - cx);
    uv.x = cx - mod(ax, w*0.22);
    uv.y = uMir.y + mod(uv.y - uMir.y + ax*0.9, h*0.4);
  }

  // directional streaks, length varies per thin column
  vec2 dir = vec2(sin(uAng), cos(uAng));
  vec2 perp = vec2(dir.y, -dir.x);
  float across = dot(px, perp);
  float colId = floor(across/(3.0*S));
  float zone = smoothstep(0.3, 0.72, vnoise(vUv*vec2(1.4,1.9) + vec2(uTime*0.07, -uTime*0.11)));
  float ch = hash12(vec2(colId, floor(uTime*3.0)));
  float sl = zone * uMelt * (0.15 + 0.85*ch*ch) * 0.16 * uRes.y + 1.0;
  // pixel stretch: hold one sample over a run of length sl along the streak
  float along0 = dot(px, dir) + hash12(vec2(colId, 7.0))*sl;
  float back = mod(along0, sl);
  vec2 suv = uv - dir*back/uRes;
  vec2 stepv = dir * 6.0 * uScale / uRes;
  vec3 c = st(suv)*0.4 + (st(suv + stepv) + st(suv - stepv))*0.2 + (st(suv + 2.0*stepv) + st(suv - 2.0*stepv))*0.1;
  c = mix(st(uv), c, smoothstep(0.0, 0.25, zone*uMelt));

  // silver grade
  float l = luma(c);
  vec3 g = mix(vec3(l), c, 0.34);
  g = (g - 0.5)*1.32 + 0.5;
  g *= vec3(1.03, 1.0, 0.95);
  g += vec3(0.02, 0.0, 0.05)*(1.0 - l);
  g = clamp(g, 0.0, 1.0);

  // rainbow pixel cells hugging contours and edges
  vec2 cs = vec2(8.0, 3.0)*S;
  vec2 cell = floor(px/cs);
  vec2 cc = (cell + 0.5)*cs/uRes;
  float lc = luma(st(cc));
  vec2 e2 = 4.0*S/uRes;
  float e = abs(luma(st(cc+vec2(e2.x,0.0))) - luma(st(cc-vec2(e2.x,0.0))))
          + abs(luma(st(cc+vec2(0.0,e2.y))) - luma(st(cc-vec2(0.0,e2.y))));
  float region = smoothstep(0.5, 0.75, vnoise(cc*vec2(1.8,2.4) + vec2(uTime*0.13, uTime*0.21)));
  float stripe = fract(lc*6.0 - uTime*0.6);
  float band = smoothstep(0.0, 0.05, stripe)*(1.0 - smoothstep(0.26, 0.32, stripe));
  float prob = region*(band*0.95 + smoothstep(0.12, 0.35, e)*0.3) * uGlitch;
  float lit = step(1.0 - prob, hash12(cell + floor(uTime*12.0)*vec2(3.1,7.7)));
  float inside = step(fract(px.y/cs.y), 0.66)*step(fract(px.x/cs.x), 0.85);
  vec3 pc = pal(lc*4.0 + hash12(cell)*2.0 + floor(uTime*2.0));
  g *= 1.0 - region*band*0.6*uGlitch;
  g = mix(g, pc*(0.75 + 0.45*lc), lit*inside);

  // glitch band: black slab with coloured dashes
  if(inBand > 0.5){
    g *= 0.12;
    vec2 dc = vec2(3.0, 14.0)*S;
    vec2 dcell = floor(px/dc);
    float hh = hash12(dcell + uBand.w*31.0 + floor(uTime*15.0));
    float ins = step(fract(px.x/dc.x), 0.6)*step(fract(px.y/dc.y), 0.8);
    g = mix(g, pal(hh*37.0), step(0.6, hh)*ins);
  }

  // long thin colour strokes running with the streaks
  float along = dot(px, dir);
  float row = floor(across/(6.0*S));
  float lt = floor(uTime*6.0);
  float lh = hash12(vec2(row, lt));
  if(lh > 1.0 - 0.02*uGlitch){
    float a0 = hash12(vec2(row + 1.7, lt))*uRes.y*1.2 - 0.2*uRes.y;
    float alen = (0.03 + 0.14*hash12(vec2(row, lt + 3.3)))*uRes.y;
    float on = step(a0, along)*step(along, a0 + alen)*step(fract(across/(6.0*S)), 0.75);
    g = mix(g, pal(hash12(vec2(row*1.37, lt + 9.1))*6.0), on*0.92);
  }

  g += (hash12(px + fract(uTime)*97.0) - 0.5)*0.045;
  vec2 v = vUv - 0.5;
  g *= 1.0 - 0.5*dot(v, v);
  gl_FragColor = vec4(g, 1.0);
}`;

function shader(type, src){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function program(fs){
  const p = gl.createProgram();
  gl.attachShader(p, shader(gl.VERTEX_SHADER, VS));
  gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(p, 0, 'p');
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for(let i = 0; i < n; i++){ const name = gl.getActiveUniform(p, i).name; u[name] = gl.getUniformLocation(p, name); }
  return {p, u};
}
function tex(){
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0,0,0,255]));
  return t;
}

let pFb, pOut;
try { pFb = program(FS_FEEDBACK); pOut = program(FS_OUT); }
catch(e){ console.error(e); }

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

const camTex = [tex(), tex()];
let camCur = 0;
const state = [0,1].map(() => { const t = tex(); const f = gl.createFramebuffer(); return {t, f}; });
let stateIdx = 0, SW = 0, SH = 0, CW = 0, CH = 0;

function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const longSide = Math.min(1280, Math.round(Math.max(w, h)*dpr));
  const k = longSide/Math.max(w, h);
  CW = Math.round(w*k/2)*2; CH = Math.round(h*k/2)*2;
  if(canvas.width !== CW || canvas.height !== CH){ canvas.width = CW; canvas.height = CH; }
  const sk = 720/Math.max(CW, CH);
  const nSW = Math.round(CW*sk), nSH = Math.round(CH*sk);
  if(nSW !== SW || nSH !== SH){
    SW = nSW; SH = nSH;
    for(const s of state){
      gl.bindTexture(gl.TEXTURE_2D, s.t);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, SW, SH, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
      gl.bindFramebuffer(gl.FRAMEBUFFER, s.f);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, s.t, 0);
      gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    ev.keyFrames = 6;
  }
}

/* ---------- controls ---------- */
const $ = id => document.getElementById(id);
const melt = $('melt'), glitch = $('glitch');
const params = {melt:.75, glitch:.7};
function bindSlider(el, out, key){
  const upd = () => { params[key] = el.value/100; out.textContent = el.value; try{ localStorage.setItem('sm-'+key, el.value); }catch(e){} };
  try{ const v = localStorage.getItem('sm-'+key); if(v !== null) el.value = v; }catch(e){}
  el.addEventListener('input', upd); upd();
}
bindSlider(melt, $('meltOut'), 'melt');
bindSlider(glitch, $('glitchOut'), 'glitch');

/* ---------- random events (keyframes, glitch bands, mirror slabs, streak angle) ---------- */
const ev = {key:0, keyFrames:6, band:[0,0,0,0], bandUntil:0, mir:[0,0,0,0], mirUntil:0,
  ang:0, angT:0, nextAng:0, nextKey:2, nextBand:1, nextMir:3};
const rnd = (a, b) => a + Math.random()*(b - a);
function startBand(now, big){
  ev.band = [rnd(.1,.9), big ? rnd(.05,.12) : rnd(.015,.07), 1, Math.random()];
  ev.bandUntil = now + rnd(.12, big ? .7 : .45);
}
function startMir(now){
  const w = rnd(.3,.8), h = rnd(.15,.4), x = rnd(0, 1-w), y = rnd(0, 1-h);
  ev.mir = [x, y, x+w, y+h]; ev.mirUntil = now + rnd(.25, .9);
}
function updateEvents(now){
  const g = params.glitch, m = params.melt;
  if(now > ev.nextAng){ ev.angT = [0,0,0,.5,-.5,.85,-.3,.15][Math.floor(Math.random()*8)]; ev.nextAng = now + rnd(2,6); }
  ev.ang += (ev.angT - ev.ang)*0.03;
  if(now > ev.nextKey){ ev.key = .85; ev.nextKey = now + (1.2 + 5*m)*rnd(.6,1.4); }
  if(ev.keyFrames > 0){ ev.key = 1; ev.keyFrames--; }
  if(now > ev.nextBand){ if(Math.random() < .3 + .7*g) startBand(now); ev.nextBand = now + rnd(.6, 3.5)*(1.25 - g); }
  if(now > ev.bandUntil) ev.band[2] = 0; else ev.band[0] += rnd(-.004,.004);
  if(now > ev.nextMir){ if(Math.random() < g*.55) startMir(now); ev.nextMir = now + rnd(2,6); }
  if(now > ev.mirUntil) ev.mir = [0,0,0,0];
}
canvas.addEventListener('pointerdown', () => {
  const now = performance.now()/1000;
  startBand(now, true);
  if(Math.random() < .6) startMir(now);
  ev.angT = (Math.random() - .5)*1.8;
});

/* ---------- camera ---------- */
let stream = null, facing = 'user', mirror = true, newFrame = false, lastVT = -1, audioTrack = null;
function watchFrames(){
  if('requestVideoFrameCallback' in HTMLVideoElement.prototype){
    const cb = () => { newFrame = true; video.requestVideoFrameCallback(cb); };
    video.requestVideoFrameCallback(cb);
  }
}
async function startCamera(){
  stopStream();
  const wantSound = $('sound').checked;
  const constraints = {video:{facingMode:facing, width:{ideal:1280}, height:{ideal:720}, frameRate:{ideal:30}}, audio:wantSound};
  try { stream = await navigator.mediaDevices.getUserMedia(constraints); }
  catch(e){
    if(wantSound && e.name !== 'NotAllowedError'){ stream = await navigator.mediaDevices.getUserMedia({video:constraints.video, audio:false}); }
    else throw e;
  }
  audioTrack = stream.getAudioTracks()[0] || null;
  video.removeAttribute('src');
  video.srcObject = stream;
  video.muted = true;
  mirror = facing === 'user';
  await video.play();
  ev.keyFrames = 6;
}
function stopStream(){ if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; } }

async function useFile(file){
  stopStream(); audioTrack = null;
  video.srcObject = null;
  video.src = URL.createObjectURL(file);
  video.loop = true; video.muted = true; mirror = false;
  await video.play();
  ev.keyFrames = 6;
  $('flip').disabled = true;
  showApp();
}

let running = false, wakeLock = null;
function showApp(){
  $('start').hidden = true; $('dock').hidden = false;
  running = true;
  try { navigator.wakeLock?.request('screen').then(l => wakeLock = l).catch(() => {}); } catch(e){}
}
function showError(msg){ const el = $('err'); el.textContent = msg; el.hidden = false; }

$('go').addEventListener('click', async () => {
  if(!window.isSecureContext || !navigator.mediaDevices?.getUserMedia){
    showError('The camera only works when this page is opened from an https:// address. You can still try the filter on a video from your library.');
    return;
  }
  try { await startCamera(); $('flip').disabled = false; showApp(); }
  catch(e){
    showError(e.name === 'NotAllowedError'
      ? 'Camera access was blocked. In Safari tap “aA” → Website Settings → Camera → Allow, then try again.'
      : 'Could not start the camera (' + (e.message || e.name) + ').');
  }
});
$('pick').addEventListener('change', e => { const f = e.target.files[0]; if(f) useFile(f).catch(err => showError('Could not play that video.')); });
$('flip').addEventListener('click', async () => {
  if(rec) return;
  facing = facing === 'user' ? 'environment' : 'user';
  try { await startCamera(); } catch(e){ facing = facing === 'user' ? 'environment' : 'user'; }
});
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && running){
    if(stream && stream.getVideoTracks().some(t => t.readyState === 'ended')) startCamera().catch(() => {});
    else video.play().catch(() => {});
    try { navigator.wakeLock?.request('screen').then(l => wakeLock = l).catch(() => {}); } catch(e){}
  }
});

/* ---------- render loop ---------- */
let lastT = 0;
function frame(tms){
  requestAnimationFrame(frame);
  if(!running || !pFb) return;
  const now = tms/1000;
  const dt = lastT ? Math.min(now - lastT, .1) : 1/60;
  lastT = now;
  resize();
  updateEvents(now);

  const vw = video.videoWidth, vh = video.videoHeight;
  if(!vw || !vh) return;
  if(!('requestVideoFrameCallback' in HTMLVideoElement.prototype)){
    if(video.currentTime !== lastVT){ lastVT = video.currentTime; newFrame = true; }
  }
  if(newFrame){
    newFrame = false;
    camCur = 1 - camCur;
    gl.bindTexture(gl.TEXTURE_2D, camTex[camCur]);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    try { gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video); } catch(e){}
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  }

  // cover-crop the camera into the canvas
  const ca = CW/CH, va = vw/vh;
  let sx = 1, sy = 1;
  if(va > ca) sx = ca/va; else sy = va/ca;

  // pass 1
  const src = state[stateIdx], dst = state[1 - stateIdx];
  gl.bindFramebuffer(gl.FRAMEBUFFER, dst.f);
  gl.viewport(0, 0, SW, SH);
  gl.useProgram(pFb.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, camTex[camCur]);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, camTex[1 - camCur]);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, src.t);
  gl.uniform1i(pFb.u.uCam, 0); gl.uniform1i(pFb.u.uCamPrev, 1); gl.uniform1i(pFb.u.uState, 2);
  gl.uniform2f(pFb.u.uRes, SW, SH);
  gl.uniform1f(pFb.u.uTime, now % 1000);
  gl.uniform1f(pFb.u.uMelt, params.melt);
  gl.uniform1f(pFb.u.uKey, ev.key);
  gl.uniform1f(pFb.u.uStep, dt*60);
  gl.uniform1f(pFb.u.uMirror, mirror ? 1 : 0);
  gl.uniform4f(pFb.u.uXf, sx, sy, (1 - sx)/2, (1 - sy)/2);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  stateIdx = 1 - stateIdx;
  ev.key *= .5;

  // pass 2
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, CW, CH);
  gl.useProgram(pOut.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, dst.t);
  gl.uniform1i(pOut.u.uState, 0);
  gl.uniform2f(pOut.u.uRes, CW, CH);
  gl.uniform1f(pOut.u.uTime, now % 1000);
  gl.uniform1f(pOut.u.uGlitch, params.glitch);
  gl.uniform1f(pOut.u.uMelt, params.melt);
  gl.uniform1f(pOut.u.uAng, ev.ang);
  gl.uniform1f(pOut.u.uScale, Math.max(CW, CH)/1280);
  gl.uniform4f(pOut.u.uBand, ev.band[0], ev.band[1], ev.band[2], ev.band[3]);
  gl.uniform4f(pOut.u.uMir, ev.mir[0], ev.mir[1], ev.mir[2], ev.mir[3]);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
watchFrames();
requestAnimationFrame(frame);

/* ---------- recording & photos ---------- */
let rec = null, chunks = [], recStart = 0, timerId = 0, pending = null;
const pad = n => String(n).padStart(2, '0');
function pickMime(){
  if(!window.MediaRecorder) return null;
  const types = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
  return types.find(t => { try { return MediaRecorder.isTypeSupported(t); } catch(e){ return false; } }) || '';
}
function startRec(){
  const mime = pickMime();
  if(mime === null || !canvas.captureStream){ showResultError('Recording is not supported in this browser. Use the iPhone screen recorder instead.'); return; }
  const out = canvas.captureStream(30);
  if(audioTrack && audioTrack.readyState === 'live') out.addTrack(audioTrack);
  try { rec = new MediaRecorder(out, mime ? {mimeType:mime, videoBitsPerSecond:8e6} : {}); }
  catch(e){ rec = new MediaRecorder(out); }
  chunks = [];
  rec.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    const type = (rec && rec.mimeType) || mime || 'video/mp4';
    const blob = new Blob(chunks, {type});
    rec = null;
    document.body.classList.remove('recording');
    clearInterval(timerId);
    const ext = type.includes('mp4') ? 'mp4' : 'webm';
    showResult(blob, 'silver-mosh-' + Date.now() + '.' + ext, 'video');
  };
  rec.start(500);
  recStart = Date.now();
  document.body.classList.add('recording');
  $('shutter').setAttribute('aria-label', 'Stop recording');
  $('timer').textContent = '00:00';
  timerId = setInterval(() => { const s = Math.floor((Date.now() - recStart)/1000); $('timer').textContent = pad(Math.floor(s/60)) + ':' + pad(s%60); }, 250);
}
function stopRec(){ if(rec && rec.state !== 'inactive') rec.stop(); $('shutter').setAttribute('aria-label', 'Record video'); }
$('shutter').addEventListener('click', () => { if(!running) return; rec ? stopRec() : startRec(); });
$('photo').addEventListener('click', () => {
  if(!running) return;
  canvas.toBlob(b => { if(b) showResult(b, 'silver-mosh-' + Date.now() + '.png', 'image'); }, 'image/png');
});

function showResultError(msg){
  const box = $('resultMedia'); box.innerHTML = '';
  const p = document.createElement('p'); p.textContent = msg; box.appendChild(p);
  $('save').hidden = true; $('result').hidden = false; pending = null;
}
function showResult(blob, name, kind){
  const box = $('resultMedia'); box.innerHTML = '';
  const url = URL.createObjectURL(blob);
  const el = document.createElement(kind === 'video' ? 'video' : 'img');
  el.className = 'media'; el.src = url;
  if(kind === 'video'){ el.playsInline = true; el.loop = true; el.muted = true; el.autoplay = true; el.controls = true; }
  box.appendChild(el);
  pending = {blob, name, url};
  $('save').hidden = false; $('result').hidden = false;
}
$('save').addEventListener('click', async () => {
  if(!pending) return;
  const file = new File([pending.blob], pending.name, {type:pending.blob.type});
  try {
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file]}); return; }
  } catch(e){ if(e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = pending.url; a.download = pending.name;
  document.body.appendChild(a); a.click(); a.remove();
});
$('discard').addEventListener('click', () => {
  $('result').hidden = true;
  if(pending){ setTimeout(() => URL.revokeObjectURL(pending.url), 1000); pending = null; }
  $('resultMedia').innerHTML = '';
});

window.addEventListener('resize', resize);
})();
</script>
</body>
</html>
